<!-- ブランドマーク（`components/Logo.tsx` と同じ図形）を 16px でも読める太さに直したもの。
     重なる 2 つのタイル = 画像を見比べる / 重複を重ねる。
     色は UI.md §5.1 の主色 teal をリテラルで持つ（favicon に CSS トークンは届かない）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0F766E" />
  <rect x="6" y="6" width="14" height="14" rx="3.5" fill="#5EEAD4" />
  <rect x="12" y="12" width="14" height="14" rx="3.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" />
</svg>
